name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Universal)
            os: macos-latest
            artifact: HD-macOS
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - name: Windows
            os: windows-latest
            artifact: HD-Windows
            cmake_args: ""
          - name: Linux
            os: ubuntu-latest
            artifact: HD-Linux
            cmake_args: -DGLFW_BUILD_WAYLAND=OFF

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev ninja-build

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/HD
          cp -R build/HD.app dist/HD/
          cp build/hdc dist/HD/
          cp -R examples dist/HD/examples
          cp README.md dist/HD/
          hdiutil create -volname "HD" -srcfolder dist/HD -ov -format UDZO dist/${{ matrix.artifact }}.dmg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/HD | Out-Null
          Copy-Item build/Release/HD.exe dist/HD/
          Copy-Item build/Release/hdc.exe dist/HD/
          Copy-Item -Recurse examples dist/HD/examples
          Copy-Item README.md dist/HD/
          Compress-Archive -Path dist/HD -DestinationPath dist/${{ matrix.artifact }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/HD
          cp build/HD build/hdc dist/HD/
          cp -R examples dist/HD/examples
          cp README.md dist/HD/
          tar -C dist -czf dist/${{ matrix.artifact }}.tar.gz HD

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
